name: Publish

# Releases come only from a version tag (v1.2.3) that matches package.json.
# Authentication: npm trusted publishing (OIDC), no stored token. The NPM_TOKEN secret is
# only for the very first release, before the packages exist on npm; delete it afterwards.
on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm test

  publish:
    needs: test
    # GitHub-hosted runner: required for trusted publishing and provenance.
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false

      - name: Check npm version (trusted publishing needs 11.5.1 or newer)
        run: |
          node -e '
            const [a, b, c] = process.argv[1].split(".").map(Number);
            if (a < 11 || (a === 11 && (b < 5 || (b === 5 && c < 1)))) {
              console.error(`npm ${process.argv[1]} is older than 11.5.1`);
              process.exit(1);
            }
          ' "$(npm --version)"

      - name: Check that the tag matches package.json
        env:
          TAG: ${{ github.ref_name }}
        run: |
          EXPECTED="v$(node -p 'require("./package.json").version')"
          if [ "$TAG" != "$EXPECTED" ]; then
            echo "Tag $TAG does not match package.json version $EXPECTED"
            exit 1
          fi

      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: node scripts/check-pack.mjs
      - run: node scripts/check-pack.mjs packages/herestt

      - name: Publish heresthething
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -n "$NPM_TOKEN" ]; then
            echo "Using the one-time NPM_TOKEN secret. Delete it once trusted publishing is set up."
            export NODE_AUTH_TOKEN="$NPM_TOKEN"
          fi
          npm publish --provenance --access public --ignore-scripts

      - name: Publish herestt placeholder (skipped when this version is already on npm)
        working-directory: packages/herestt
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          NAME_VERSION="herestt@$(node -p 'require("./package.json").version')"
          if npm view "$NAME_VERSION" version > /dev/null 2>&1; then
            echo "$NAME_VERSION is already on npm"
            exit 0
          fi
          if [ -n "$NPM_TOKEN" ]; then
            export NODE_AUTH_TOKEN="$NPM_TOKEN"
          fi
          npm publish --provenance --access public --ignore-scripts
